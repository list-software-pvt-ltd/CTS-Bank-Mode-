# =====================================================================
# MFA (mfa-core-1.0.0.jar) settings for CTS-BANK-MODE.
# src/ is deployed to WEB-INF/classes. To keep secrets out of the deployed folder, put a copy outside and start Tomcat with
#   -Dmfa.config=D:/mfa/cts-bank-mfa.properties         (that file then wins over this one)
# ${NAME:default} values come from -D system properties or environment variables.
# The app code (CTS-BANK-MODE) is set in WebContent/jsp/mfaInitiate.jsp.
# =====================================================================

# ---------- MFA schema ----------
mfa.db.url=jdbc:oracle:thin:@//172.100.30.18:1521/newtest
mfa.db.user=MFA_APP
mfa.db.password=${MFA_DB_PASSWORD:MFA_APP_PASS}

# ---------- SMS_OTP: SMSBANK.SMSOUTQUEUE ----------
mfa.sms.outward-no-sql=SELECT NVL(MAX(SOQ_OUTWARDNO),0)+1 FROM SMSBANK.SMSOUTQUEUE
# Bind order is FIXED: 1 = outward no, 2 = mobile no, 3 = message text.
# >>> Adjust the column list to the real SMSOUTQUEUE layout before go-live. <<<
mfa.sms.insert-sql=INSERT INTO SMSBANK.SMSOUTQUEUE (SOQ_OUTWARDNO, SOQ_OUTWARDDT, SOQ_OUTWARDDTTM, SOQ_MOBILENO, SOQ_MESSAGE, SOQ_PROCESSED) VALUES (?, SYSDATE, SYSTIMESTAMP, ?, ?, 'N')
mfa.sms.retry-max=5

# ---------- Mobile no / QR device id from CBS (POLY) ----------
# Live CBS value first; when CBS has none, MFA_USER.MOBILE_NO / DEVICE_ID (import or admin page). One ? = the login user code.
# First column of the first row is used; blank in both CBS and MFA_USER -> MOBILE_NOT_REGISTERED / DEVICE_NOT_REGISTERED.
# Runs on the MFA connection: GRANT SELECT ON POLY.USERSMSTR, POLY.CUSTOMERMASTER TO MFA_APP;
mfa.user.mobile-sql=SELECT REG_MOBILENO FROM POLY.CUSTOMERMASTER WHERE CUSTOMERID = (SELECT USM_CUSTCODE FROM POLY.USERSMSTR WHERE USM_CODE = ?)
mfa.user.device-sql=SELECT USM_DEVICEID FROM POLY.USERSMSTR WHERE USM_CODE = ?

# ---------- Admin page (WebContent/jsp/mfaAdmin.jsp) ----------
# Fixed admin password: at least 12 characters, or sha256:<64 hex>. Blank / unset = admin page disabled.
# Keep it out of this file: set MFA_ADMIN_PASSWORD on the server.
mfa.admin.password=${MFA_ADMIN_PASSWORD:MFA_ADMIN_PASS}
# App codes shown on the admin page (codes already in MFA_USER_APP_CONFIG are added automatically)
mfa.admin.apps=EFT,AML,CIBIL,CKYC,CTS-BANK-MODE,CTS-SYSTEM-MODE,APS
# "Import from CBS": every POLY user with a mobile no or a QR device id. Columns: user code, mobile no, device id.
mfa.user.import-sql=SELECT USRNAME, NULL, NULL FROM CTS.USRMSTR

# ---------- LEGACY_QR ----------
# RSA private key of the QR scheme (Base64 PKCS#8, the validationdata= value of QRValidationApp's QRlogin.properties).
# Secret: on servers set MFA_QR_PRIVATE_KEY; the default below is this developer machine's 2048-bit key.
mfa.qr.private-key=${MFA_QR_PRIVATE_KEY:}
# mfa.qr.private-key-file=${MFA_QR_KEY_FILE:D:/Paras/MFA/QRValidationApp.jar.src/QRlogin.properties}
# Placeholders: {otp} {deviceId} {externalUserId} {appCode} {purpose} {challengeId}
# >>> Set this to the exact concatenation format the QR scanner app expects. <<<
mfa.qr.payload-format=random_no={otp}{deviceId}
mfa.qr.size-px=250
